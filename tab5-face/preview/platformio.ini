; Desktop preview of the Otto face (macOS / Linux, needs SDL2).
;   brew install sdl2
;   pio run -e preview -t exec          -> opens a window, tap = next reaction
;   pio run -e snapshots -t exec        -> saves one PPM image per reaction

[platformio]
default_envs = preview

[env]
platform = native
lib_compat_mode = off   ; AnimatedGIF is tagged Arduino-only, but it builds natively.
lib_deps =
  m5stack/M5Unified
  bitbank2/AnimatedGIF@2.2.3
build_flags = -O1 -xc++ -std=c++17 -lSDL2
  -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
  -L"${sysenv.HOMEBREW_PREFIX}/lib"
  -I"/usr/local/include/SDL2"
  -L"/usr/local/lib"
  -I..
  -DM5GFX_SHOW_FRAME
  -DM5GFX_BOARD=board_M5Tab5
  -DM5GFX_SCALE=1
  -DM5GFX_ROTATION=0

[env:preview]

[env:snapshots]
build_flags = ${env.build_flags} -DFACE_SNAPSHOTS

; Also saves small frames to snapshots/rec/ for an animated preview.
[env:record]
build_flags = ${env.build_flags} -DFACE_SNAPSHOTS -DFACE_RECORD
